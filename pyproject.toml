[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accesscam"
version = "0.1.0"
description = "Head-tracking mouse using an IR camera and a retroreflective dot — an open-source replacement for the NaturalPoint SmartNav"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "John Borek" }]
keywords = ["accessibility", "head-tracking", "assistive-technology", "smartnav", "mouse"]
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
accesscam = "accesscam.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot change what CI enforces.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
