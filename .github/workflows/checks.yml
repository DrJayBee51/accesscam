name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check part folders are complete
        run: python tools/check_hardware.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # OpenCV needs libgl1/libglib2.0-0. The rest are Qt's: the UI tests build a
      # real window on the offscreen platform, which still links these even
      # though it never opens a display.
      - name: Install OpenCV and Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
